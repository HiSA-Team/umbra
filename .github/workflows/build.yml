# Build CI. Reviewed for workflow injection: no `${{ github.event.* }}`,
# `github.head_ref`, commit/PR/issue text appears in any `run:` block.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TARGET: thumbv8m.main-none-eabi

jobs:
  cargo-check:
    name: cargo check (required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabi, riscv32imac-unknown-none-elf
          components: clippy, rustfmt

      - uses: ./.github/actions/install-arm-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: cargo check (entry-point crates)
        # The `arm` and `drivers` crates are platform-agnostic libraries
        # that depend on `kernel` with `default-features = false`. They do
        # not select a `platform-*` feature themselves — that's the boot
        # crate's job. Checking them in isolation would build kernel with
        # no platform feature, which fails by design (ess.rs constants are
        # cfg-gated). The boot crate `cargo check`s cover arm + drivers
        # transitively with the right features, so we skip them here.
        run: |
          set -euo pipefail
          for crate in \
              src/hardware/common/peripheral_regs \
              src/kernel \
              src/hardware/platform/stm32l552/boot \
              src/hardware/platform/stm32n657/boot ; do
            echo "::group::cargo check $crate"
            (cd "$crate" && cargo check --target "$RUST_TARGET")
            echo "::endgroup::"
          done
          # The riscv32 monitor uses its own bare-metal target, so check it
          # explicitly outside the thumbv8m loop.
          echo "::group::cargo check riscv32 boot"
          (cd src/hardware/platform/riscv32/boot && cargo check --target riscv32imac-unknown-none-elf)
          echo "::endgroup::"

  feature-matrix:
    name: cargo check matrix (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── L552 / L562 boot crate — most diverse feature space ─────────
          - { name: "l552 boot default",      crate: "src/hardware/platform/stm32l552/boot", flags: "" }
          - { name: "l552 boot no-default",   crate: "src/hardware/platform/stm32l552/boot", flags: "--no-default-features" }
          - { name: "l552 boot chained only", crate: "src/hardware/platform/stm32l552/boot", flags: "--no-default-features --features chained_measurement" }
          - { name: "l562 boot (HW AES)",     crate: "src/hardware/platform/stm32l552/boot", flags: "--features stm32l562" }
          - { name: "l552 boot benchmark",    crate: "src/hardware/platform/stm32l552/boot", flags: "--features benchmark,i_acknowledge_benchmark_is_research_only" }
          # ── N657 boot crate ─────────────────────────────────────────────
          - { name: "n657 boot default",      crate: "src/hardware/platform/stm32n657/boot", flags: "" }
          - { name: "n657 boot no-default",   crate: "src/hardware/platform/stm32n657/boot", flags: "--no-default-features" }
          - { name: "n657 boot tests",        crate: "src/hardware/platform/stm32n657/boot", flags: "--features boot_tests" }
          # ── kernel crate — platform selectors ───────────────────────────
          - { name: "kernel platform-l552",   crate: "src/kernel", flags: "" }
          - { name: "kernel platform-n657",   crate: "src/kernel", flags: "--no-default-features --features platform-n657" }
          # ── RISC-V RV32 (QEMU virt) — own bare-metal target ─────────────
          - { name: "riscv32 boot default",    crate: "src/hardware/platform/riscv32/boot", flags: "", target: "riscv32imac-unknown-none-elf" }
          - { name: "kernel platform-riscv32", crate: "src/kernel", flags: "--no-default-features --features platform-riscv32", target: "riscv32imac-unknown-none-elf" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabi, riscv32imac-unknown-none-elf
      - uses: ./.github/actions/install-arm-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: cargo check (${{ matrix.name }})
        env:
          CRATE: ${{ matrix.crate }}
          CARGO_ARGS: ${{ matrix.flags }}
          # Per-row target; ARM rows omit `target` and fall back to RUST_TARGET.
          ROW_TARGET: ${{ matrix.target || env.RUST_TARGET }}
        # `CARGO_ARGS` is intentionally word-split by the shell — matrix
        # values are author-controlled YAML, not external input.
        # shellcheck disable=SC2086
        run: |
          set -euo pipefail
          cd "$CRATE"
          cargo check --target "$ROW_TARGET" $CARGO_ARGS

  clippy:
    name: cargo clippy (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabi, riscv32imac-unknown-none-elf
          components: clippy

      - uses: ./.github/actions/install-arm-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: cargo clippy (entry-point crates)
        # arm / drivers skipped — see `cargo-check` job for rationale; both
        # are covered transitively when checking the boot crates.
        run: |
          for crate in \
              src/hardware/common/peripheral_regs \
              src/kernel \
              src/hardware/platform/stm32l552/boot \
              src/hardware/platform/stm32n657/boot ; do
            echo "::group::cargo clippy $crate"
            (cd "$crate" && cargo clippy --target "$RUST_TARGET" --all-targets) || true
            echo "::endgroup::"
          done
          # riscv32 monitor uses its own bare-metal target.
          echo "::group::cargo clippy riscv32 boot"
          (cd src/hardware/platform/riscv32/boot && cargo clippy --target riscv32imac-unknown-none-elf) || true
          echo "::endgroup::"

  rustfmt:
    name: cargo fmt --check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          for crate in \
              src/hardware/common/peripheral_regs \
              src/hardware/architecture/arm \
              src/hardware/architecture/riscv \
              src/hardware/platform/stm32l552/drivers \
              src/hardware/platform/stm32n657/drivers \
              src/kernel \
              src/hardware/platform/stm32l552/boot \
              src/hardware/platform/stm32n657/boot \
              src/hardware/platform/riscv32/boot ; do
            echo "::group::cargo fmt $crate"
            (cd "$crate" && cargo fmt --check) || true
            echo "::endgroup::"
          done

  host-workspace:
    name: cargo test (workspace, host-side)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (host target only)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-host

      - name: cargo check (host members)
        # Firmware crates target thumbv8m.main-none-eabi and run their
        # own assembly build scripts (arm-none-eabi-as). This job runs
        # on the host toolchain only — embedded build/check is the
        # `cargo-check` + `feature-matrix` jobs above, which install
        # the ARM toolchain. Narrow to host-buildable members
        # explicitly via -p flags. The kernel is host-buildable (no
        # MMIO, depends only on umbra-hal traits which umbra-pal-test
        # satisfies in software) so its tests run as part of CI.
        run: cargo check -p xtask -p umbra-pal-test -p kernel -p umbra-hal -p umbra-error -p umbra-api -p umbra-riscv-arch --locked

      - name: cargo clippy (host crates, warnings deny)
        # Strict on the workspace leaf + host crates. Kernel has
        # pre-existing style debt (manual_div_ceil, missing_safety_doc,
        # unnecessary_cast, etc.) tracked separately; not blocked on
        # it here.
        run: cargo clippy -p xtask -p umbra-pal-test -p umbra-hal -p umbra-error -p umbra-api -p umbra-riscv-arch --all-targets --locked -- -D warnings

      - name: cargo test (host members)
        run: cargo test -p xtask -p umbra-pal-test -p kernel -p umbra-hal -p umbra-error -p umbra-api -p umbra-riscv-arch --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo llvm-cov (host members → lcov.info)
        # Coverage scope mirrors the cargo test step above. Whole-workspace
        # llvm-cov fails because cargo's feature unification activates both
        # platform-l552 and platform-n657 on the kernel crate at once, which
        # the ess.rs cfg-gated compile_error rejects by design. The host
        # job's per-crate narrowing avoids that.
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov \
            -p xtask -p umbra-pal-test -p kernel -p umbra-hal -p umbra-error -p umbra-api -p umbra-riscv-arch \
            --lcov --output-path lcov.info \
            --ignore-filename-regex '(host/|lib/|tools/)'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  file-size-cap:
    name: file-size cap
    runs-on: ubuntu-latest
    # File-size cap gate (hard cap = 600 LOC, soft cap = 400 LOC) per
    # tools/check_file_size.sh. Currently advisory; flip to required
    # by dropping `continue-on-error` once residual soft warnings have
    # been decomposed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: tools/check_file_size.sh
        run: ./tools/check_file_size.sh

  python-lint:
    name: ruff (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check tools/

  shell-lint:
    name: shellcheck (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck scripts
        run: |
          shopt -s globstar nullglob
          files=( rebuild_all.sh debug.sh tools/**/*.sh tools/*.sh )
          [ ${#files[@]} -eq 0 ] && { echo "no scripts found"; exit 0; }
          shellcheck "${files[@]}" || true

  riscv-qemu-smoke:
    name: riscv32 QEMU smoke (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # End-to-end analog of the ARM hardware smoke test (which CI cannot run):
    # build the SPMP-patched QEMU (cached), build the monitor + host, and assert
    # the enclave returns R0=0x72CA33A8 over the UART. Advisory: the QEMU build
    # depends on apt package availability on the runner, so it must not gate.
    continue-on-error: true
    steps:
      # No `submodules: recursive`: the QEMU submodule is ~1 GB and is only
      # needed on a cache MISS (the patches are tracked in-repo, the built
      # binary is cached). build-qemu-spmp.sh inits the submodule itself when
      # it actually has to build.
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf

      - name: Install riscv bare-metal GCC + QEMU build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-unknown-elf \
            ninja-build pkg-config python3 python3-venv \
            libglib2.0-dev libpixman-1-dev

      - name: Cache patched QEMU
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: tools/qemu-spmp/install
          key: qemu-spmp-${{ runner.os }}-${{ hashFiles('tools/qemu-spmp/QEMU_PIN', 'tools/qemu-spmp/patches/**') }}

      - name: Build patched QEMU (cache miss only)
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        env:
          PYTHON: python3
        run: ./tools/qemu-spmp/build-qemu-spmp.sh

      - name: Build + smoke-run on QEMU
        env:
          MCU_VARIANT: riscv32
          PYTHON: python3
        run: |
          set -euo pipefail
          ./rebuild_all.sh
          # debug.sh execs QEMU on stdio and never self-exits; timebox it and
          # assert the enclave result landed on the UART.
          ( timeout 60 ./debug.sh || true ) | tee smoke.log
          grep -q "R0=0x72CA33A8" smoke.log

      - name: Negative isolation — S-host denied enclave ESS (PMP)
        env:
          MCU_VARIANT: riscv32
          PYTHON: python3
        run: |
          set -euo pipefail
          HOST_FEATURES=neg_iso_host ./rebuild_all.sh
          ( timeout 60 ./debug.sh || true ) | tee neg_host.log
          # S-mode host read of the enclave ESS is PMP-denied: the host-world PMP
          # grant stops at ESS_BASE, so the access is a load access fault (mcause 5)
          # at mtval=0x80200000. sPMP does not gate S-mode — this fence is pure PMP.
          grep -q "V=80200000" neg_host.log
          grep -q "C=00000005" neg_host.log
          ! grep -q "R0=0x72CA33A8" neg_host.log
          ! grep -q "NEG-ISO. FAIL" neg_host.log

      - name: Negative isolation — U-enclave denied host region (sPMP)
        env:
          MCU_VARIANT: riscv32
          PYTHON: python3
        run: |
          set -euo pipefail
          HOST_FEATURES=neg_iso_enc ./rebuild_all.sh
          ( timeout 60 ./debug.sh || true ) | tee neg_enc.log
          # U-mode enclave read of the host region has no U-mode sPMP rule, so it
          # is sPMP-denied: a load page fault (mcause 13) at mtval=0x80100000. The
          # enclave never completes (no R0=).
          grep -q "V=80100000" neg_enc.log
          grep -q "C=0000000d" neg_enc.log
          ! grep -q "R0=0x72CA33A8" neg_enc.log

      - name: Restore demo keys
        if: always()
        run: |
          git checkout -- \
            src/hardware/platform/riscv32/boot/src/master_key.rs \
            src/hardware/platform/stm32l552/boot/src/master_key.rs \
            src/hardware/platform/stm32n657/boot/src/master_key.rs \
            tools/master_key.bin 2>/dev/null || true

# RISC-V (RV32) bare-metal Umbra host 

# Standalone build (own `[workspace]`) so it does not join the firmware
# workspace — mirroring how the L552 host is a separate Makefile project.
[package]
name = "umbra-riscv-host-baremetal"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bare_metal"
path = "src/main.rs"

[features]
# Negative-isolation probes (throwaway, on-target). Each makes one ring attempt
# a forbidden access; the monitor's fault dump confirms the deny via mtval.
neg_iso_host = []     # S-mode host reads the enclave ESS -> must trap (V=80200000)
neg_iso_enc = []      # U-mode enclave reads the host region -> must trap (V=80100000)

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[profile.dev]
panic = "abort"

[workspace]

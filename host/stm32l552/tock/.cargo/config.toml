[build]
target = "thumbv8m.main-none-eabi"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

# `-Tlayout.ld` lives in the board crate's build.rs, NOT here — putting it
# in workspace config pollutes every crate (chips, capsules, the libtock-rs
# TBF app) and breaks them.

# Defaults for libtock-rs's auto_layout(). The libtock crate's build.rs
# calls auto_layout() unconditionally and panics if neither LIBTOCK_PLATFORM
# nor LIBTOCK_LINKER_FLASH+_RAM are set — which would break bare
# `cargo check --workspace`. With force=false (default), the Makefile's
# explicit env settings still win for real builds. Values match the
# Makefile's APP_FLASH / APP_FLASH_LEN / APP_RAM / APP_RAM_LEN.
[env]
LIBTOCK_LINKER_FLASH = "0x08070000"
LIBTOCK_LINKER_FLASH_LENGTH = "0x8000"
# RAM at 0x20010000-0x2001FFFF — the only NS-accessible 64 KB of SRAM.
# 0x20020000+ is EFBC (Secure-attributed by Umbra GTZC); NS access there
# raises SecureFault.AUVIOL.
LIBTOCK_LINKER_RAM = "0x20010000"
LIBTOCK_LINKER_RAM_LENGTH = "0x10000"

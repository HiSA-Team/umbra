# STM32N657 — ATTACH (no-reset) openocd profile.
#
# Why this exists: the default openocd_scripts/stm32n6x.cfg sets
#   CONNECT_UNDER_RESET 1 + reset_config ... connect_assert_srst
# so openocd connects while HOLDING the chip in reset. The FSBL therefore
# never runs, RIF/clocks stay unconfigured, and Secure peripheral registers
# (SAES @0x5402_1000, RIFSC @0x5402_4000, BSEC, CRYP1) read back as 0 /
# "Failed to read memory". That is the trap that made tools/dhuk_probe.gdb's
# `monitor reset halt` useless (see project_n657_rifsc_blocked memory).
#
# This profile attaches to the ALREADY-BOOTED FSBL without resetting it, so
# the registers are in their production, FSBL-configured state and are
# readable from the Secure debug AP (AP 1). Use together with a gdb script
# that does `monitor halt` — NOT `monitor reset halt`.
#
# Boot the board first (BOOT1=Flash-Boot + RESET), let the banner appear at
# 115200, THEN launch openocd with this cfg and attach gdb.
#
# Peripheral RISUP filtering is by security+privilege, NOT CID (the DAP's
# default CID=7 is irrelevant for SAES/RIFSC reads), so no DAPCID change is
# needed — the Secure AP is what matters.

source ./openocd_scripts/interface/stlink-dap.cfg
set WORKAREASIZE 0x10000
transport select "dapdirect_swd"

set CHIPNAME STM32N657X0
set BOARDNAME NUCLEO-N657X0-Q
set ENABLE_LOW_POWER 1
set STOP_WATCHDOG 1
set CLOCK_FREQ 8000

# No-reset attach: do NOT assert SRST on connect, do NOT connect under reset.
reset_config srst_only srst_nogate
set CONNECT_UNDER_RESET 0
set CORE_RESET 0
set AP_NUM 1
set GDB_PORT 3333

source ./openocd_scripts/target/stm32n6x.cfg

[package]
name = "umbra-n657-boot"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7"
arm = { path = "../../../architecture/arm" }
# Cargo `package` alias keeps `use drivers::*` working in source code
# while the underlying package name is unique across the workspace
# (each platform's drivers crate uses the same `drivers` Rust name).
drivers = { path = "../drivers", package = "umbra-n657-drivers" }
kernel = { path = "../../../../kernel", default-features = false, features = ["platform-n657"] }
peripheral_regs = { path = "../../../common/peripheral_regs" }
# `crypto_impl.rs` uses `umbra_hal::Hash` directly to dispatch the
# trait-based hash() method. Re-export through `drivers` would
# alias-collide with `drivers::hash::Hash` (the inherent struct),
# so the trait crate enters as a direct dep here.
umbra-hal = { path = "../../../../../crates/umbra-hal" }
# `crypto_impl.rs` maps HW failures to UmbraError variants.
umbra-error = { path = "../../../../../crates/umbra-error" }

[features]
default = ["chained_measurement", "n657_aes_hw", "boot_tests"]
boot_tests = []
chained_measurement = []
# `ess_miss_recovery` is referenced via `#[cfg(feature = "ess_miss_recovery")]`
# in shared `secure_kernel.rs` (UDF-trap demand-paging path). Not enabled on
# N657 — there's no transparent block-decrypt peripheral here for runtime
# fetch — but declared so the cfg checks don't emit `unexpected_cfgs` warnings.
ess_miss_recovery = []

# N657 hardware AES path via CRYP1 + SAES1.
n657_aes_hw = []

# DEV-ONLY: open the Cortex-M55 debug access port from the FSBL (BSEC_DBGCR /
# BSEC_AP_UNLOCK), mirroring embassy-boot-stm32, so a debugger can attach even
# on a closed/locked product state. SECURITY: defeats debug isolation — must
# NEVER be in a production image. Injected by `cargo xtask flash n657`
# (UMBRA_DEV_DEBUG=1 in settings.sh); OFF in plain `cargo xtask build`.
dev_debug = []

# Enclave anti-rollback: derive version-by-search + per-author BKPSRAM floor.
# Gated (default OFF) to mirror the offline tool's UMBRA_VERSION_BIND gate; OFF
# keeps the build byte-identical to the legacy chained-measurement finalize.
enclave_version_bind = []

# DEV-ONLY: run the state-continuity proof-slice probe at boot (real TAMP + HASH,
# RAM-backed sectors, no XSPI2 write) and print the result over UART. Default OFF;
# enable via BOOT_FEATURES. Never in a production image.
state_continuity_probe = []

# DEV-ONLY: run the XSPI2 write-path bring-up probe at boot (mode/WREN/restore,
# then erase/program as the path is built up) and print over UART. Default OFF.
# Never in a production image.
xspi_write_probe = []

# Profiles live at the workspace root since the boot crate absorbed
# them. See /Cargo.toml [profile.dev] and [profile.release].

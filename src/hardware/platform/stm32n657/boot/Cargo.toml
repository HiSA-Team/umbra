[package]
name = "umbra-n657-boot"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7"
arm = { path = "../../../architecture/arm" }
# Cargo `package` alias keeps `use drivers::*` working in source code
# while the underlying package name is unique across the workspace
# (each platform's drivers crate uses the same `drivers` Rust name).
drivers = { path = "../drivers", package = "umbra-n657-drivers" }
kernel = { path = "../../../../kernel", default-features = false, features = ["platform-n657"] }
peripheral_regs = { path = "../../../common/peripheral_regs" }
# `crypto_impl.rs` uses `umbra_hal::Hash` directly to dispatch the
# trait-based hash() method. Re-export through `drivers` would
# alias-collide with `drivers::hash::Hash` (the inherent struct),
# so the trait crate enters as a direct dep here.
umbra-hal = { path = "../../../../../crates/umbra-hal" }
# `crypto_impl.rs` maps HW failures to UmbraError variants.
umbra-error = { path = "../../../../../crates/umbra-error" }

[features]
default = ["chained_measurement", "n657_aes_hw", "boot_tests", "interenclave_overlay"]
boot_tests = []
chained_measurement = []
# `ess_miss_recovery` is referenced via `#[cfg(feature = "ess_miss_recovery")]`
# in shared `secure_kernel.rs` (UDF-trap demand-paging path). Not enabled on
# N657 — there's no transparent block-decrypt peripheral here for runtime
# fetch — but declared so the cfg checks don't emit `unexpected_cfgs` warnings.
ess_miss_recovery = []

# N657 hardware AES path via CRYP1 + SAES1.
n657_aes_hw = []

# DEV-ONLY: open the Cortex-M55 debug access port from the FSBL (BSEC_DBGCR /
# BSEC_AP_UNLOCK), mirroring embassy-boot-stm32, so a debugger can attach even
# on a closed/locked product state. SECURITY: defeats debug isolation — must
# NEVER be in a production image. Injected by `cargo xtask flash n657`
# (UMBRA_DEV_DEBUG=1 in settings.sh); OFF in plain `cargo xtask build`.
dev_debug = []

# Enclave anti-rollback: derive version-by-search + per-author BKPSRAM floor.
# Gated (default OFF) to mirror the offline tool's UMBRA_VERSION_BIND gate; OFF
# keeps the build byte-identical to the legacy chained-measurement finalize.
enclave_version_bind = []

# DEV-ONLY: run the state-continuity proof-slice probe at boot (real TAMP + HASH,
# RAM-backed sectors, no XSPI2 write) and print the result over UART. Default OFF;
# enable via BOOT_FEATURES. Never in a production image.
state_continuity_probe = []

# DEV-ONLY: run the XSPI2 write-path bring-up probe at boot (mode/WREN/restore,
# then erase/program as the path is built up) and print over UART. Default OFF.
# Never in a production image.
xspi_write_probe = []

# DEV-ONLY: runtime-integration demo — drive the REAL enclave state_checkpoint
# module (checkpoint_enclave/restore_enclave) with the REAL device state_root,
# round-tripped across a reset, from a clean boot hook. Prints [RD]. Default OFF.
# Never in a production image.
state_runtime_demo = []

# DEV-ONLY: pause the enclave at the FIRST block-transition checkpoint of a cold
# run (gen==1) so the resume across a reset is observable by hand. Prints [SC] cold
# checkpoint ... press RST. Default OFF. Never in a production image.
checkpoint_reset_demo = []

# DEV-ONLY: probe the RISAF data-read trap (the mechanism that makes safe block eviction
# possible on N657, unlike L552). Protects a 4 KB scratch and reads it — the fault dump
# reveals which fault fires. HALTS on the fault. Default OFF. Never in a production image.
eviction_probe = []

# DEV-ONLY: MPU hide+restore eviction probe. Hides the enclave entry block via MPU region 5
# so the first fetch faults MemManage; the handler restores + resumes. Proves the MPU
# trap+restore (the synchronous data trap the RISAF cannot give). Default OFF. Never ship.
mpu_evict_probe = []

# DEV-ONLY: inter-enclave eviction round-trip. Evicts the enclave's EFBC → an ESS SRAM
# backing (async DMA), scrambles the EFBC, restores it → the enclave must still finish
# R0=0x72CA33A8. Proves the feasible eviction mechanism on N657. Default OFF. Never ship.
interenclave_evict = []

# DEV-ONLY: async ESS-miss demonstrator. Evicts the enclave's back half to a backing +
# MPU-hides it, then async-restores it in the BACKGROUND while the enclave runs its front
# half — the async DMA→IRQ→PendSV engine driving a real block recovery under a running
# enclave (HIT), with a synchronous MemManage fallback if the enclave outruns it (FAULT).
# The production enclave never misses (all blocks loaded+measured at create), so this can
# only be a demonstrator. Enclave must still finish R0=0x72CA33A8. Default OFF. Never ship.
# Mutually exclusive at runtime with the overlay chain (which is default via
# `interenclave_overlay`); demonstrator builds should not rely on both being armed on the
# same enclave.
async_ess_miss = []

# Inter-enclave OVERLAY: time-multiplex the tight 16 KB EFBC across TWO live enclaves that
# can't coexist (e.g. ammunition 60 blocks + ndes 20 blocks > 64). create/enter evict the
# resident enclave's window → an SRAM backing and restore the entered one ← its backing
# (prefetch.rs::overlay, generalizing the HW-verified inter_evict round-trip). The two
# enclaves stay ALIVE simultaneously and are switched by the host loop / SysTick preemption.
# Enables the 32 KB of per-enclave backings. DEFAULT-ON (in `default` above): the kernel
# time-multiplexes automatically — a no-op for single-enclave hosts (nothing to switch), an
# automatic swap when a second enclave is created into the full window. The SysTick switch
# uses the speculative non-blocking chunk chain by default (overlay_chain.rs);
# `overlay_sync_switch` forces the old fully-synchronous behavior. No build flag needed.
interenclave_overlay = []

# Bisection aid for the overlay ASYNC switch: force every SysTick window switch to
# complete synchronously (drain immediately after the sync prefix) instead of running
# the background chunk chain. Functionally equivalent to the pre-async behavior;
# CHAIN_HITS stays 0. Only meaningful together with `interenclave_overlay`.
overlay_sync_switch = []

# Profiles live at the workspace root since the boot crate absorbed
# them. See /Cargo.toml [profile.dev] and [profile.release].

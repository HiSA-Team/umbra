[package]
name = "umbra-l552-boot"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7"
arm = { path = "../../../architecture/arm" }
# Cargo `package` alias keeps `use drivers::*` working in source code
# while the underlying package name is unique across the workspace
# (each platform's drivers crate uses the same `drivers` Rust name).
drivers = { path = "../drivers", package = "umbra-l552-drivers" }
kernel = { path = "../../../../kernel", default-features = false, features = ["platform-l552"] }
peripheral_regs = { path = "../../../common/peripheral_regs" }
# `crypto_impl.rs` uses `umbra_hal::Hash` directly to dispatch the
# trait-based hash() method. Re-export through `drivers` would
# alias-collide with `drivers::hash::Hash` (the inherent struct),
# so the trait crate enters as a direct dep here.
umbra-hal = { path = "../../../../../crates/umbra-hal" }
# `crypto_impl.rs` maps HW failures to UmbraError variants.
umbra-error = { path = "../../../../../crates/umbra-error" }

[features]
default = ["chained_measurement", "ess_miss_recovery", "umbra-speculation"]
boot_tests = []
stm32l562 = ["drivers/stm32l562"]
chained_measurement = []
ess_miss_recovery = []
benchmark = []
# Required alongside `benchmark` to acknowledge that this feature is research
# instrumentation, not for production firmware. Keeps `cargo build --features
# benchmark` from silently producing a boot-bricking image.
i_acknowledge_benchmark_is_research_only = []
cache-zero-mode = ["kernel/cache-zero-mode"]
bench-eval = ["kernel/bench-eval"]
# Evict all-but-entry after force-load so code-only enclaves demand-page at
# runtime (restores the overhead-vs-ESS-size curve). Requires ess_miss_recovery.
# Use only on code-only benches; the protect_enclave.py guard enforces this.
demand-paging = []
# Propagate the speculation feature to the kernel crate. See
# kernel/Cargo.toml for the rationale.
umbra-speculation = ["kernel/umbra-speculation"]

# Profiles live at the workspace root since the boot crate absorbed
# them. See /Cargo.toml [profile.dev] and [profile.release].